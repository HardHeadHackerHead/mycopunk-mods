name: Bug report
description: Something in one of the mods doesn't work as it should
labels: [bug]
body:
  - type: input
    id: mod
    attributes:
      label: Which mod, and its version
      description: The version is in your mod manager, or on the mod's page.
      placeholder: No Blasphemy 1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      placeholder: Roachard still said it in the intro mission.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Start a mission with ...
        2. ...
  - type: dropdown
    id: where
    attributes:
      label: Where you played
      options:
        - Single player
        - Hosting for friends
        - Joined someone's game
  - type: textarea
    id: mods
    attributes:
      label: Your other mods
      description: Your mod manager can copy the list, or name the big ones.
  - type: textarea
    id: log
    attributes:
      label: The log
      description: Attach BepInEx/LogOutput.log from the game folder (or your mod manager's profile folder), or paste the red lines.
      render: text
